name: CI

concurrency:  # 2 · nivel del workflow
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**']  
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Traer el código
        uses: actions/checkout@v4

      - name: 2. Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: 3. Instalar dependencias
        working-directory: tests
        run: npm ci

      - name: 4. Instalar el navegador
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: 5. Levantar la app
        run: docker compose up -d

      - name: 6. Esperar a que responda
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/ > /dev/null && exit 0
            sleep 2
          done
          echo "La app no respondió"; exit 1

      - name: 7. Ejecutar las pruebas
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
        run: npm test

      - name: 8. Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias
          # el reporte lo genera tu automatización; 
          # ajusta la ruta a la tuya
          path: |
            tests/reports/
            tests/test-results/
          retention-days: 7

      - name: 9. Logs si algo falla
        if: failure()
        run: docker compose logs --tail=200
